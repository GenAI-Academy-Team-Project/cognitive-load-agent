name: Container and cloud build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install
      - name: Test deployment configuration
        working-directory: web
        run: node --test scripts/*.test.mjs
      - name: Validate cloud bundle without deploying
        run: make cloud-check
        env:
          CLOUDFLARE_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
      - run: make up
      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health
          curl --fail http://localhost:3000/sign-in > /dev/null
      - name: Container logs
        if: always()
        run: docker compose -f compose.local.yaml logs
      - name: Stop containers
        if: always()
        run: make down
