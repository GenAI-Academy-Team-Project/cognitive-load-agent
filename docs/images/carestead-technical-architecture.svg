<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carestead technical architecture</title>
  <desc id="desc">A layered architecture: sign-up and sign-in, session-authenticated APIs, active membership and recipient access, recipient-scoped agent orchestrator, lightweight structured retrieval, policy and approval controls, tools, Cloudflare D1, audit traces, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eef4ee"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173f31"/><stop offset="1" stop-color="#356a50"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173f31" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#48735d"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#173a2e}.muted{fill:#62736b}.box{fill:#fffdf8;stroke:#d2dcd4;stroke-width:2}.head{font:700 25px Inter,Arial,sans-serif;fill:#173a2e}.body{font:400 17px Inter,Arial,sans-serif;fill:#62736b}.small{font:700 14px Inter,Arial,sans-serif;letter-spacing:2px}.tag{font:700 15px Inter,Arial,sans-serif}.flow{fill:none;stroke:#48735d;stroke-width:4;marker-end:url(#a)}.icon{fill:none;stroke:#2b6049;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="76" text-anchor="middle" class="serif ink" font-size="58" font-weight="700">Carestead technical architecture</text>
  <text x="800" y="116" text-anchor="middle" class="sans muted" font-size="19" letter-spacing="4">A SIMPLE, GROUNDED, APPROVAL-FIRST SYSTEM</text>

  <path class="flow" d="M275 327H330M565 327H620M980 327H1035M1270 327H1325"/>
  <path class="flow" d="M800 450V505"/>
  <path class="flow" d="M1442 450V478H1152V505"/>
  <path class="flow" d="M1270 632H1325"/>

  <g transform="translate(40 205)" filter="url(#s)"><rect class="box" width="235" height="245" rx="24"/><rect width="235" height="58" rx="24" fill="url(#top)"/><rect y="34" width="235" height="24" fill="url(#top)"/><text x="117" y="38" text-anchor="middle" class="sans" fill="#fff" font-size="21" font-weight="700">Experience</text><path class="icon" d="M76 91h83v56H76zM88 103h30v31H88M126 104h23M126 116h23M126 128h15M106 147v18M87 165h39"/><text x="117" y="194" text-anchor="middle" class="head">Caregiver UI</text><text x="117" y="222" text-anchor="middle" class="body">Sign in • care UI • chat</text></g>
  <g transform="translate(330 205)" filter="url(#s)"><rect class="box" width="235" height="245" rx="24"/><rect width="235" height="58" rx="24" fill="url(#top)"/><rect y="34" width="235" height="24" fill="url(#top)"/><text x="117" y="38" text-anchor="middle" class="sans" fill="#fff" font-size="21" font-weight="700">Trust boundary</text><path class="icon" d="M77 100h81M77 119h81M77 138h81M91 94v50M145 94v50"/><text x="117" y="190" text-anchor="middle" class="head">Authenticated APIs</text><text x="117" y="218" text-anchor="middle" class="body">Session • role • validation</text></g>
  <g transform="translate(620 175)" filter="url(#s)"><rect class="box" width="360" height="275" rx="24" stroke="#71947f"/><rect width="360" height="62" rx="24" fill="#285943"/><rect y="35" width="360" height="27" fill="#285943"/><text x="180" y="40" text-anchor="middle" class="sans" fill="#fff" font-size="23" font-weight="700">Agent orchestrator</text><circle cx="82" cy="121" r="31" fill="#e5eee7"/><path class="icon" d="M72 122l8 8 16-19M128 105h180M128 124h145M128 143h165"/><text x="42" y="191" class="head">Observe → retrieve → decide</text><text x="42" y="222" class="body">Deterministic care-state rules today</text><text x="42" y="249" class="body">Optional LLM adapter behind controls</text></g>
  <g transform="translate(1035 205)" filter="url(#s)"><rect class="box" width="235" height="245" rx="24" stroke="#d7b46e"/><rect width="235" height="58" rx="24" fill="#b57a17"/><rect y="34" width="235" height="24" fill="#b57a17"/><text x="117" y="38" text-anchor="middle" class="sans" fill="#fff" font-size="21" font-weight="700">Grounding</text><path class="icon" d="M81 98c0-15 73-15 73 0v52c0 15-73 15-73 0zm0 0c0 15 73 15 73 0m-73 25c0 15 73 15 73 0"/><text x="117" y="190" text-anchor="middle" class="head">Lightweight RAG</text><text x="117" y="218" text-anchor="middle" class="body">Structured, scoped retrieval</text></g>
  <g transform="translate(1325 205)" filter="url(#s)"><rect class="box" width="235" height="245" rx="24" stroke="#d7a494"/><rect width="235" height="58" rx="24" fill="#ad543d"/><rect y="34" width="235" height="24" fill="#ad543d"/><text x="117" y="38" text-anchor="middle" class="sans" fill="#fff" font-size="21" font-weight="700">Safety gate</text><path class="icon" d="M117 86l38 15v28c0 29-19 47-38 56-19-9-38-27-38-56v-28zM99 132l13 13 25-31"/><text x="117" y="205" text-anchor="middle" class="head">Policy + approval</text><text x="117" y="230" text-anchor="middle" class="body">Role • consent • impact</text></g>

  <g transform="translate(305 505)" filter="url(#s)"><rect class="box" width="690" height="155" rx="24"/><text x="35" y="39" class="small" fill="#48735d">RECIPIENT-SCOPED CONTEXT</text><text x="35" y="77" class="sans ink" font-size="22" font-weight="700">Profile • plans • tasks • events</text><text x="35" y="109" class="body">Risks • memories • exact records selected by recipient_id</text><text x="35" y="135" class="body">and returned with every grounded answer as visible evidence.</text><rect x="540" y="36" width="114" height="34" rx="17" fill="#e8efe9"/><text x="597" y="58" text-anchor="middle" class="tag ink">Local facts</text><rect x="509" y="85" width="145" height="34" rx="17" fill="#f5e9cb"/><text x="581" y="107" text-anchor="middle" class="tag" fill="#79520d">No vector DB</text></g>
  <g transform="translate(1035 505)" filter="url(#s)"><rect class="box" width="235" height="155" rx="24"/><text x="28" y="42" class="small" fill="#ad543d">ALLOWED TOOLS</text><text x="28" y="78" class="head">Care actions</text><text x="28" y="108" class="body">Schedule • assign • notify</text><text x="28" y="133" class="body">check • create task</text></g>
  <g transform="translate(1325 505)" filter="url(#s)"><rect class="box" width="235" height="155" rx="24"/><text x="28" y="42" class="small" fill="#48735d">DURABLE DATA</text><text x="28" y="78" class="head">Cloudflare D1</text><text x="28" y="108" class="body">Accounts • sessions • care</text><text x="28" y="133" class="body">invitations • audit • traces</text></g>

  <g transform="translate(110 715)"><rect width="1380" height="120" rx="25" fill="#173f31"/><text x="42" y="43" class="small" fill="#f2dfad">TECH STACK</text><text x="42" y="81" class="sans" fill="#fff" font-size="22" font-weight="700">TypeScript  •  React 19  •  Vinext  •  Tailwind CSS  •  Cloudflare Workers + D1  •  OpenAI Sites</text><line x1="1035" y1="24" x2="1035" y2="96" stroke="#6f8e7e"/><text x="1070" y="53" class="small" fill="#f2dfad">QUALITY LOOP</text><text x="1070" y="83" class="sans" fill="#dce9df" font-size="17">Traces → tests → improvements</text></g>
</svg>
