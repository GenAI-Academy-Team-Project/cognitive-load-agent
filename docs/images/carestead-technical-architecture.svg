<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carestead technical architecture</title>
  <desc id="desc">A simple architecture connecting multimodal caregiver inputs, authenticated APIs with source and file validation, agent orchestration, grounded retrieval, safety controls, tools, and durable data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eef4ee"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173f31"/><stop offset="1" stop-color="#356a50"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173f31" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#48735d"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#173a2e}.muted{fill:#62736b}
      .box{fill:#fffdf8;stroke:#d2dcd4;stroke-width:2}.title{font:700 22px Inter,Arial,sans-serif;fill:#173a2e}.body{font:400 15px Inter,Arial,sans-serif;fill:#62736b}.eyebrow{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.6px}.flow{fill:none;stroke:#48735d;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" class="serif ink" font-size="52" font-weight="700">Carestead technical architecture</text>
  <text x="800" y="108" text-anchor="middle" class="sans muted" font-size="17" letter-spacing="4">A SIMPLE, GROUNDED, APPROVAL-FIRST SYSTEM</text>

  <path class="flow" d="M310 300H335M615 300H640M920 300H945M1225 300H1250"/>
  <path class="flow" d="M780 420V480M1085 420V480M1390 420V480"/>
  <path class="flow" d="M1215 575H1260"/>

  <g transform="translate(30 180)" filter="url(#shadow)"><rect class="box" width="280" height="240" rx="24"/><path d="M0 24Q0 0 24 0H256Q280 0 280 24V62H0z" fill="url(#green)"/><text x="140" y="39" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">Caregiver experience</text><circle cx="140" cy="113" r="31" fill="#e7efe9"/><path d="M124 109h32v22h-32zM130 115h20M130 122h14" fill="none" stroke="#285b46" stroke-width="3"/><text x="140" y="170" text-anchor="middle" class="title">Multimodal application</text><text x="140" y="199" text-anchor="middle" class="body">Dashboard • plans • handover</text><text x="140" y="222" text-anchor="middle" class="body">Text • voice • image • document</text></g>
  <g transform="translate(335 180)" filter="url(#shadow)"><rect class="box" width="280" height="240" rx="24"/><path d="M0 24Q0 0 24 0H256Q280 0 280 24V62H0z" fill="url(#green)"/><text x="140" y="39" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">Trust boundary</text><circle cx="140" cy="113" r="31" fill="#e7efe9"/><path d="M125 105h30v25h-30zM132 105v-7c0-10 16-10 16 0v7" fill="none" stroke="#285b46" stroke-width="3"/><text x="140" y="170" text-anchor="middle" class="title">Authenticated APIs</text><text x="140" y="199" text-anchor="middle" class="body">Identity • roles • consent</text><text x="140" y="222" text-anchor="middle" class="body">Input • source • file validation</text></g>
  <g transform="translate(640 180)" filter="url(#shadow)"><rect class="box" width="280" height="240" rx="24" stroke="#71947f"/><path d="M0 24Q0 0 24 0H256Q280 0 280 24V62H0z" fill="#285943"/><text x="140" y="39" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">Agent orchestrator</text><circle cx="140" cy="113" r="31" fill="#e7efe9"/><path d="M127 113l9 9 18-22" fill="none" stroke="#285b46" stroke-width="4" stroke-linecap="round"/><text x="140" y="168" text-anchor="middle" class="title">Observe and decide</text><text x="140" y="197" text-anchor="middle" class="body">Model synthesis • fixed rules</text><text x="140" y="220" text-anchor="middle" class="body">One recipient-scoped agent</text></g>
  <g transform="translate(945 180)" filter="url(#shadow)"><rect class="box" width="280" height="240" rx="24" stroke="#d7b46e"/><path d="M0 24Q0 0 24 0H256Q280 0 280 24V62H0z" fill="#b57a17"/><text x="140" y="39" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">Grounding</text><circle cx="140" cy="113" r="31" fill="#f6edd5"/><path d="M123 101c0-7 34-7 34 0v25c0 7-34 7-34 0zm0 0c0 7 34 7 34 0m-34 13c0 7 34 7 34 0" fill="none" stroke="#8a6114" stroke-width="3"/><text x="140" y="168" text-anchor="middle" class="title">Lightweight RAG</text><text x="140" y="197" text-anchor="middle" class="body">Structured D1 retrieval</text><text x="140" y="220" text-anchor="middle" class="body">Scoped records with evidence</text></g>
  <g transform="translate(1250 180)" filter="url(#shadow)"><rect class="box" width="280" height="240" rx="24" stroke="#d7a494"/><path d="M0 24Q0 0 24 0H256Q280 0 280 24V62H0z" fill="#ad543d"/><text x="140" y="39" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">Safety gate</text><circle cx="140" cy="113" r="31" fill="#f8e9e4"/><path d="M140 91l22 9v17c0 17-11 28-22 33-11-5-22-16-22-33v-17zM129 117l8 8 15-18" fill="none" stroke="#9a4935" stroke-width="3"/><text x="140" y="168" text-anchor="middle" class="title">Policy and approval</text><text x="140" y="197" text-anchor="middle" class="body">Role • consent • impact</text><text x="140" y="220" text-anchor="middle" class="body">Human control before writes</text></g>

  <g transform="translate(135 480)" filter="url(#shadow)"><rect class="box" width="645" height="190" rx="24"/><text x="34" y="42" class="eyebrow" fill="#48735d">RECIPIENT-SCOPED CONTEXT</text><text x="34" y="82" class="title">Profile • plan • tasks • events • contacts</text><text x="34" y="116" class="body">Exact records are selected by recipient ID and returned</text><text x="34" y="141" class="body">with each grounded answer as visible evidence.</text></g>
  <g transform="translate(825 480)" filter="url(#shadow)"><rect class="box" width="390" height="190" rx="24"/><text x="34" y="42" class="eyebrow" fill="#ad543d">ALLOWED TOOLS</text><text x="34" y="82" class="title">Constrained care actions</text><text x="34" y="116" class="body">Tasks • organizer • calendar</text><text x="34" y="141" class="body">Notifications • memory • care checks</text><text x="34" y="166" class="body">External writes require approval.</text></g>
  <g transform="translate(1260 480)" filter="url(#shadow)"><rect class="box" width="270" height="190" rx="24"/><text x="28" y="42" class="eyebrow" fill="#48735d">DURABLE DATA</text><text x="28" y="82" class="title">Cloudflare D1</text><text x="28" y="116" class="body">Care state • conversations</text><text x="28" y="141" class="body">Approvals • audit trails</text><text x="28" y="166" class="body">Evaluation traces</text></g>

  <g transform="translate(110 725)"><rect width="1380" height="120" rx="24" fill="#173f31"/><text x="42" y="40" class="eyebrow" fill="#f2dfad">TECH STACK</text><text x="42" y="76" class="sans" fill="#fff" font-size="18" font-weight="700">TypeScript • React 19 • Vinext • Tailwind CSS</text><text x="42" y="101" class="sans" fill="#dce9df" font-size="15">Cloudflare Workers • D1 • OpenAI Responses API • browser speech</text><line x1="965" y1="22" x2="965" y2="98" stroke="#6f8e7e"/><text x="1005" y="40" class="eyebrow" fill="#f2dfad">QUALITY LOOP</text><text x="1005" y="76" class="sans" fill="#fff" font-size="17" font-weight="700">Traces → benchmark → regression checks</text><text x="1005" y="101" class="sans" fill="#dce9df" font-size="15">Recall • precision • grounding • safety • outcome</text></g>
</svg>
