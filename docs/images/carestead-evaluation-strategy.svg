<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carestead evaluation strategy</title>
  <desc id="desc">Carestead evaluates synthetic care scenarios across the full agent trajectory, scores eight quality dimensions, and blocks releases when a hard safety rule fails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eef4ee"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173f31"/><stop offset="1" stop-color="#356a50"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173f31" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#48735d"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#173a2e}.muted{fill:#62736b}
      .box{fill:#fffdf8;stroke:#d2dcd4;stroke-width:2}.title{font:700 22px Inter,Arial,sans-serif;fill:#173a2e}.body{font:400 15px Inter,Arial,sans-serif;fill:#62736b}.small{font:400 13px Inter,Arial,sans-serif;fill:#62736b}.eyebrow{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.6px}.flow{fill:none;stroke:#48735d;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" class="serif ink" font-size="52" font-weight="700">Carestead evaluation strategy</text>
  <text x="800" y="104" text-anchor="middle" class="sans muted" font-size="17" letter-spacing="4">TEST THE WHOLE TRAJECTORY, NOT JUST THE FINAL ANSWER</text>

  <g transform="translate(55 155)" filter="url(#shadow)">
    <rect class="box" width="355" height="475" rx="24"/>
    <path d="M0 24Q0 0 24 0H331Q355 0 355 24V65H0z" fill="url(#green)"/>
    <text x="177.5" y="42" text-anchor="middle" class="sans" fill="#fff" font-size="19" font-weight="700">1 · Synthetic test set</text>
    <text x="32" y="112" class="eyebrow" fill="#48735d">104 FICTIONAL SCENARIOS</text>
    <text x="32" y="153" class="title">Known inputs and outcomes</text>
    <g transform="translate(32 184)"><rect width="137" height="72" rx="16" fill="#e7efe9"/><text x="68.5" y="31" text-anchor="middle" class="sans ink" font-size="25" font-weight="700">16</text><text x="68.5" y="54" text-anchor="middle" class="small">risk cases</text></g>
    <g transform="translate(186 184)"><rect width="137" height="72" rx="16" fill="#f6edd5"/><text x="68.5" y="31" text-anchor="middle" class="sans ink" font-size="25" font-weight="700">88</text><text x="68.5" y="54" text-anchor="middle" class="small">trajectories</text></g>
    <text x="32" y="296" class="body">8 product workflows</text>
    <text x="32" y="324" class="body">11 conditions per workflow</text>
    <line x1="32" y1="349" x2="323" y2="349" stroke="#d2dcd4"/>
    <text x="32" y="383" class="small">Text • chat • voice • image</text>
    <text x="32" y="409" class="small">Consent • roles • recipient scope</text>
    <text x="32" y="435" class="small">Prompt injection • tool failure</text>
  </g>

  <g transform="translate(445 155)" filter="url(#shadow)">
    <rect class="box" width="1100" height="250" rx="24"/>
    <text x="34" y="43" class="eyebrow" fill="#48735d">2 · RUN THE COMPLETE DECISION PATH</text>
    <text x="34" y="82" class="title">Every scenario is evaluated stage by stage</text>
    <path class="flow" d="M174 158H203M346 158H375M518 158H547M690 158H719M862 158H891"/>
    <g transform="translate(34 112)"><rect width="140" height="92" rx="18" fill="#e7efe9"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Observe</text><text x="70" y="64" text-anchor="middle" class="small">input + state</text></g>
    <g transform="translate(206 112)"><rect width="140" height="92" rx="18" fill="#e7efe9"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Retrieve</text><text x="70" y="64" text-anchor="middle" class="small">scoped evidence</text></g>
    <g transform="translate(378 112)"><rect width="140" height="92" rx="18" fill="#f6edd5"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Decide</text><text x="70" y="64" text-anchor="middle" class="small">answer or action</text></g>
    <g transform="translate(550 112)"><rect width="140" height="92" rx="18" fill="#f8e9e4"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Constrain</text><text x="70" y="64" text-anchor="middle" class="small">policy + approval</text></g>
    <g transform="translate(722 112)"><rect width="140" height="92" rx="18" fill="#e7efe9"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Act</text><text x="70" y="64" text-anchor="middle" class="small">allowed tool</text></g>
    <g transform="translate(894 112)"><rect width="140" height="92" rx="18" fill="#e7efe9"/><text x="70" y="37" text-anchor="middle" class="sans ink" font-size="17" font-weight="700">Verify</text><text x="70" y="64" text-anchor="middle" class="small">record outcome</text></g>
  </g>

  <g transform="translate(445 435)" filter="url(#shadow)">
    <rect class="box" width="620" height="195" rx="24"/>
    <text x="32" y="42" class="eyebrow" fill="#48735d">3 · SCORE EIGHT DIMENSIONS</text>
    <g transform="translate(32 58)"><rect width="265" height="36" rx="12" fill="#e7efe9"/><text x="18" y="24" class="sans ink" font-size="14" font-weight="700">Retrieval recall</text></g>
    <g transform="translate(323 58)"><rect width="265" height="36" rx="12" fill="#e7efe9"/><text x="18" y="24" class="sans ink" font-size="14" font-weight="700">Retrieval precision</text></g>
    <g transform="translate(32 102)"><rect width="177" height="36" rx="12" fill="#f6edd5"/><text x="88.5" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Grounding</text></g>
    <g transform="translate(218 102)"><rect width="177" height="36" rx="12" fill="#f6edd5"/><text x="88.5" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Decision</text></g>
    <g transform="translate(404 102)"><rect width="184" height="36" rx="12" fill="#f6edd5"/><text x="92" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Policy</text></g>
    <g transform="translate(32 146)"><rect width="177" height="36" rx="12" fill="#e7efe9"/><text x="88.5" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Action + tool</text></g>
    <g transform="translate(218 146)"><rect width="177" height="36" rx="12" fill="#e7efe9"/><text x="88.5" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Outcome</text></g>
    <g transform="translate(404 146)"><rect width="184" height="36" rx="12" fill="#f8e9e4"/><text x="92" y="24" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">Safety</text></g>
  </g>

  <g transform="translate(1100 435)" filter="url(#shadow)">
    <rect width="445" height="195" rx="24" fill="#ad543d"/>
    <text x="32" y="42" class="eyebrow" fill="#ffe7de">4 · HARD SAFETY GATE</text>
    <text x="32" y="81" class="sans" fill="#fff" font-size="22" font-weight="700">One violation fails CI</text>
    <text x="32" y="116" class="sans" fill="#fff4ef" font-size="14">Recipient isolation • consent • roles</text>
    <text x="32" y="142" class="sans" fill="#fff4ef" font-size="14">Approval • validation • non-clinical limits</text>
    <text x="32" y="168" class="sans" fill="#fff4ef" font-size="14">Untrusted content • failed-tool atomicity</text>
  </g>

  <g transform="translate(110 690)">
    <rect width="1380" height="145" rx="24" fill="#173f31"/>
    <text x="42" y="42" class="eyebrow" fill="#f2dfad">CONTINUOUS QUALITY LOOP</text>
    <text x="42" y="82" class="sans" fill="#fff" font-size="21" font-weight="700">Dataset → benchmark → visible failures → fix → regression check</text>
    <text x="42" y="114" class="sans" fill="#dce9df" font-size="15">Deterministic gates run on every pull request; service-level tests exercise agent and tool boundaries with controlled doubles.</text>
    <line x1="1040" y1="24" x2="1040" y2="121" stroke="#6f8e7e"/>
    <text x="1080" y="53" class="eyebrow" fill="#f2dfad">RELEASE RULE</text>
    <text x="1080" y="88" class="sans" fill="#fff" font-size="20" font-weight="700">Safety = 100%</text>
    <text x="1080" y="115" class="sans" fill="#dce9df" font-size="14">No averaging away a violation</text>
  </g>
</svg>
