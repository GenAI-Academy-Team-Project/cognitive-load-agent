<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carestead caregiver user journey</title>
  <desc id="desc">A six-step caregiver journey from selecting a care recipient through reviewing the daily brief, asking Carestead, reviewing evidence, approving actions, and handing over with an outcome trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eef4ee"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173f31"/><stop offset=".6" stop-color="#356a50"/><stop offset="1" stop-color="#b25b42"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#173f31" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#547a65"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#173a2e}.muted{fill:#62736b}.card{fill:#fffdf8;stroke:#d4ddd5;stroke-width:2}.step{font:700 18px Inter,Arial,sans-serif;fill:#fff}.label{font:700 25px Inter,Arial,sans-serif;fill:#173a2e}.copy{font:400 17px Inter,Arial,sans-serif;fill:#62736b}.micro{font:700 14px Inter,Arial,sans-serif;letter-spacing:2px}.icon{fill:none;stroke:#2b6049;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 790C240 700 390 855 620 780s450-20 620 25 260-5 360-60v155H0z" fill="#dfe9df"/>
  <text x="800" y="82" text-anchor="middle" class="serif ink" font-size="58" font-weight="700">A caregiver’s journey</text>
  <text x="800" y="124" text-anchor="middle" class="sans muted" font-size="20" letter-spacing="5">FROM ORIENTATION TO A SAFE HANDOVER</text>
  <rect x="130" y="172" width="1340" height="10" rx="5" fill="url(#band)"/>

  <path d="M347 342H394M718 342H765M1089 342H1136" stroke="#547a65" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1240 542H1193M869 542H822M498 542H451" stroke="#547a65" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1350 432c0 65-17 92-63 104" fill="none" stroke="#547a65" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(100 220)" filter="url(#s)"><rect class="card" width="247" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#285943"/><text x="40" y="47" text-anchor="middle" class="step">1</text><path class="icon" d="M102 38a22 22 0 1 0 0 44 22 22 0 0 0 0-44zm-35 78c6-25 64-25 70 0"/><text x="24" y="151" class="label">Choose a person</text><text x="24" y="183" class="copy">Recipient scope keeps</text><text x="24" y="207" class="copy">every record isolated.</text></g>
  <g transform="translate(471 220)" filter="url(#s)"><rect class="card" width="247" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#285943"/><text x="40" y="47" text-anchor="middle" class="step">2</text><path class="icon" d="M77 40h49v59H77zM87 54h29M87 66h29M87 78h19M134 48h25M134 62h25M134 76h17"/><text x="24" y="151" class="label">Review the brief</text><text x="24" y="183" class="copy">See risks, changes, and</text><text x="24" y="207" class="copy">today’s responsibilities.</text></g>
  <g transform="translate(842 220)" filter="url(#s)"><rect class="card" width="247" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#285943"/><text x="40" y="47" text-anchor="middle" class="step">3</text><path class="icon" d="M73 42h65v44H99l-18 16V86h-8zM91 59h30M91 70h20M153 44v39M145 65h16"/><text x="24" y="151" class="label">Ask Carestead</text><text x="24" y="183" class="copy">Type or speak a question</text><text x="24" y="207" class="copy">about the current state.</text></g>
  <g transform="translate(1213 220)" filter="url(#s)"><rect class="card" width="247" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#b77b18"/><text x="40" y="47" text-anchor="middle" class="step">4</text><path class="icon" d="M75 70s17-25 42-25 42 25 42 25-17 25-42 25-42-25-42-25zm42-11a11 11 0 1 0 0 22 11 11 0 0 0 0-22"/><text x="24" y="151" class="label">Inspect evidence</text><text x="24" y="183" class="copy">Answers cite the exact</text><text x="24" y="207" class="copy">profile records retrieved.</text></g>

  <g transform="translate(1100 535)" filter="url(#s)"><rect class="card" width="360" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#b25b42"/><text x="40" y="47" text-anchor="middle" class="step">5</text><path class="icon" d="M91 42l19 19 36-38M84 79h70v40H84zM103 79V68h32v11"/><text x="24" y="151" class="label">Approve or decline</text><text x="24" y="183" class="copy">Review the proposed action first.</text><text x="24" y="207" class="copy">No approval means no data change.</text></g>
  <g transform="translate(729 535)" filter="url(#s)"><rect class="card" width="340" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#285943"/><text x="40" y="47" text-anchor="middle" class="step">6</text><path class="icon" d="M83 42h56v68H83zM94 58h34M94 72h34M94 86h22M147 68l14 14-14 14"/><text x="24" y="151" class="label">Act and record</text><text x="24" y="183" class="copy">Allowed tools execute and save</text><text x="24" y="207" class="copy">an audit and evaluation trace.</text></g>
  <g transform="translate(358 535)" filter="url(#s)"><rect class="card" width="340" height="225" rx="25"/><circle cx="40" cy="40" r="25" fill="#285943"/><text x="40" y="47" text-anchor="middle" class="step">7</text><path class="icon" d="M80 45h55v60H80zM91 60h33M91 73h33M91 86h18M139 84l20 18M152 81v14h14"/><text x="24" y="151" class="label">Handover clearly</text><text x="24" y="183" class="copy">The next caregiver receives a</text><text x="24" y="207" class="copy">live, concise, current summary.</text></g>
  <g transform="translate(100 535)" filter="url(#s)"><rect width="227" height="225" rx="25" fill="#173f31"/><text x="113" y="55" text-anchor="middle" class="micro" fill="#f2dfad">THE RESULT</text><text x="113" y="103" text-anchor="middle" class="serif" fill="#fffdf8" font-size="27" font-weight="700">Less searching.</text><text x="113" y="143" text-anchor="middle" class="serif" fill="#fffdf8" font-size="27" font-weight="700">Safer action.</text><text x="113" y="183" text-anchor="middle" class="sans" fill="#dce9df" font-size="16">Continuity across shifts.</text></g>

  <text x="800" y="835" text-anchor="middle" class="sans muted" font-size="17">Every question, decision, approval, tool call, and outcome remains recipient-scoped and auditable.</text>
</svg>
