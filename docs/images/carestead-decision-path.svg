<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carestead agent decision and approval path</title>
  <desc id="desc">A decision tree showing authentication and recipient scope, grounded retrieval, question versus action routing, evidence checks, policy and role checks, human approval, scoped tool execution, and scoreable outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eef4ee"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173f31" flood-opacity=".11"/></filter>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#3e7258"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#ad543d"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#173a2e}.muted{fill:#62736b}.node{fill:#fffdf8;stroke:#cfdad1;stroke-width:2}.risk{fill:#fff8f5;stroke:#c97860;stroke-width:2}.decision{fill:#eef4ee;stroke:#69907a;stroke-width:2}.approve{fill:#fbefd4;stroke:#c18a29;stroke-width:2}.head{font:700 22px Inter,Arial,sans-serif;fill:#173a2e}.body{font:400 16px Inter,Arial,sans-serif;fill:#62736b}.tiny{font:700 13px Inter,Arial,sans-serif;letter-spacing:1.5px}.flow{fill:none;stroke:#3e7258;stroke-width:3;marker-end:url(#g)}.stop{fill:none;stroke:#ad543d;stroke-width:3;marker-end:url(#r)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" class="serif ink" font-size="58" font-weight="700">Carestead decision path</text><text x="800" y="112" text-anchor="middle" class="sans muted" font-size="19" letter-spacing="4">GROUNDED ANSWERS • CONSTRAINED ACTIONS • HUMAN CONTROL</text>

  <path class="flow" d="M240 230H292M512 230H564M784 230H836"/><path class="flow" d="M1056 230H1115"/>
  <path class="stop" d="M946 295V385"/><path class="flow" d="M1225 295V382"/>
  <path class="flow" d="M1160 294V340H500V385"/>
  <path class="flow" d="M1225 522V565"/><path class="flow" d="M1115 635H1035"/><path class="flow" d="M850 635H780"/><path class="flow" d="M590 635H520"/>
  <path class="flow" d="M500 525V565"/><path class="stop" d="M946 525H1080V735H405V705"/>
  <path class="stop" d="M1335 452H1497V565"/><path class="stop" d="M1335 635H1435"/>
  <text x="1078" y="217" class="tiny" fill="#3e7258">YES</text><text x="960" y="350" class="tiny" fill="#ad543d">NO</text>
  <text x="786" y="329" class="tiny" fill="#3e7258">QUESTION</text><text x="1238" y="345" class="tiny" fill="#3e7258">ACTION</text>
  <text x="1240" y="550" class="tiny" fill="#3e7258">ALLOWED</text><text x="1375" y="437" class="tiny" fill="#ad543d">BLOCKED</text>
  <text x="1065" y="620" class="tiny" fill="#3e7258">YES</text><text x="1372" y="621" class="tiny" fill="#ad543d">NO</text>

  <g transform="translate(40 165)" filter="url(#s)"><rect width="200" height="130" rx="24" fill="#173f31"/><text x="100" y="48" text-anchor="middle" class="tiny" fill="#f2dfad">NEW REQUEST</text><text x="100" y="82" text-anchor="middle" class="sans" fill="#fff" font-size="22" font-weight="700">Question, signal,</text><text x="100" y="109" text-anchor="middle" class="sans" fill="#fff" font-size="22" font-weight="700">or action request</text></g>
  <g transform="translate(292 165)" filter="url(#s)"><rect class="node" width="220" height="130" rx="24"/><text x="110" y="45" text-anchor="middle" class="tiny" fill="#3e7258">ACCESS BOUNDARY</text><text x="110" y="79" text-anchor="middle" class="head">Session + scope</text><text x="110" y="107" text-anchor="middle" class="body">member • role • consent</text></g>
  <g transform="translate(564 165)" filter="url(#s)"><rect class="node" width="220" height="130" rx="24"/><text x="110" y="45" text-anchor="middle" class="tiny" fill="#3e7258">LIGHTWEIGHT RAG</text><text x="110" y="79" text-anchor="middle" class="head">Retrieve records</text><text x="110" y="107" text-anchor="middle" class="body">profile • tasks • facts • risks</text></g>
  <g transform="translate(836 165)" filter="url(#s)"><path class="decision" d="M110 0l110 65-110 65L0 65z"/><text x="110" y="57" text-anchor="middle" class="head">Enough evidence?</text><text x="110" y="84" text-anchor="middle" class="body">grounded and current</text></g>
  <g transform="translate(1115 165)" filter="url(#s)"><path class="decision" d="M110 0l110 65-110 65L0 65z"/><text x="110" y="57" text-anchor="middle" class="head">Answer or action?</text><text x="110" y="84" text-anchor="middle" class="body">classify intent</text></g>

  <g transform="translate(390 385)" filter="url(#s)"><rect class="node" width="220" height="140" rx="24"/><text x="110" y="43" text-anchor="middle" class="tiny" fill="#3e7258">QUESTION PATH</text><text x="110" y="80" text-anchor="middle" class="head">Answer + evidence</text><text x="110" y="109" text-anchor="middle" class="body">show sources and limits</text></g>
  <g transform="translate(850 385)" filter="url(#s)"><rect class="risk" width="192" height="140" rx="24"/><text x="96" y="42" text-anchor="middle" class="tiny" fill="#ad543d">NOT ENOUGH</text><text x="96" y="79" text-anchor="middle" class="head">Clarify</text><text x="96" y="108" text-anchor="middle" class="body">or safely decline</text></g>
  <g transform="translate(1115 382)" filter="url(#s)"><path class="decision" d="M110 0l110 70-110 70L0 70z"/><text x="110" y="59" text-anchor="middle" class="head">Policy allows action?</text><text x="110" y="88" text-anchor="middle" class="body">role • consent • impact</text></g>

  <g transform="translate(1435 565)" filter="url(#s)"><rect class="risk" width="125" height="140" rx="24"/><text x="62" y="43" text-anchor="middle" class="tiny" fill="#ad543d">BLOCK</text><text x="62" y="78" text-anchor="middle" class="head">No write</text><text x="62" y="106" text-anchor="middle" class="body">explain why</text></g>
  <g transform="translate(1115 565)" filter="url(#s)"><path class="approve" d="M110 0l110 70-110 70L0 70z"/><text x="110" y="58" text-anchor="middle" class="head">Caregiver approves?</text><text x="110" y="88" text-anchor="middle" class="body">review exact proposal</text></g>
  <g transform="translate(850 565)" filter="url(#s)"><rect class="node" width="185" height="140" rx="24"/><text x="92" y="42" text-anchor="middle" class="tiny" fill="#3e7258">EXECUTE</text><text x="92" y="78" text-anchor="middle" class="head">Scoped tool</text><text x="92" y="107" text-anchor="middle" class="body">recheck access first</text></g>
  <g transform="translate(590 565)" filter="url(#s)"><rect class="node" width="190" height="140" rx="24"/><text x="95" y="42" text-anchor="middle" class="tiny" fill="#3e7258">VERIFY</text><text x="95" y="78" text-anchor="middle" class="head">Observe outcome</text><text x="95" y="107" text-anchor="middle" class="body">success • failure • change</text></g>
  <g transform="translate(290 565)" filter="url(#s)"><rect class="node" width="230" height="140" rx="24"/><text x="115" y="42" text-anchor="middle" class="tiny" fill="#3e7258">LEARN SAFELY</text><text x="115" y="78" text-anchor="middle" class="head">Trace + audit</text><text x="115" y="107" text-anchor="middle" class="body">retrieval → outcome</text></g>

  <g transform="translate(250 760)"><rect width="1100" height="78" rx="22" fill="#173f31"/><text x="550" y="33" text-anchor="middle" class="tiny" fill="#f2dfad">EVERY PATH IS SCOREABLE</text><text x="550" y="60" text-anchor="middle" class="sans" fill="#fff" font-size="18">retrieval  •  evidence  •  decision  •  policy  •  tool choice  •  action  •  outcome</text></g>
  <text x="1400" y="862" text-anchor="middle" class="sans" fill="#ad543d" font-size="16" font-weight="700">Reject / timeout → no change</text>
</svg>
